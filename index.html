<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>Pangram Game</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0; padding: 0;
        display: flex; flex-direction: column; align-items: center;
        background: #fafafa; color: #333;
        touch-action: manipulation;
    }
    .header {
        width: 100%; max-width: 500px;
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px 20px; box-sizing: border-box;
        border-bottom: 1px solid #ddd; background: white;
    }
    .stats { 
        font-size: 18px; 
        font-weight: bold; 
        background: #f0f0f0; 
        padding: 6px 15px; 
        border-radius: 20px;
        color: #1a1a1a;
    }
    .stats span.score-highlight {
        color: #4CAF50;
        font-size: 20px;
    }
    .timer { font-size: 20px; font-weight: bold; color: #d32f2f; }
    
    #start-screen, #game-screen {
        width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box;
        text-align: center;
    }
    #start-screen { margin-top: 50px; }
    
    .setup-group {
        margin: 20px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }
    .setup-group label { font-weight: bold; font-size: 16px; }
    .setup-group input {
        padding: 10px; font-size: 16px; width: 100px; text-align: center;
        border: 1px solid #ccc; border-radius: 6px;
    }

    #start-btn {
        padding: 15px 30px; font-size: 18px; font-weight: bold;
        background: #4CAF50; color: white; border: none; border-radius: 8px;
        cursor: pointer; transition: 0.2s;
    }
    #start-btn:disabled { background: #999; cursor: not-allowed; }
    
    .game-info { font-size: 14px; color: #666; margin-bottom: 15px; }

    .input-display {
        font-size: 28px; height: 40px; font-weight: bold;
        text-transform: uppercase; margin-bottom: 20px; letter-spacing: 2px;
        display: flex; justify-content: center; align-items: center;
    }
    .input-display span.center-char { color: #d3a100; }
    
    .hive {
        position: relative; width: 260px; height: 260px; margin: 0 auto 30px auto;
    }
    .cell {
        position: absolute; width: 70px; height: 70px;
        border-radius: 50%; display: flex; justify-content: center; align-items: center;
        font-size: 28px; font-weight: bold; cursor: pointer; user-select: none;
        text-transform: uppercase; transition: transform 0.1s;
    }
    .cell:active { transform: scale(0.9); }
    .cell.outer { background: #e6e6e6; }
    .cell.center { background: #f8cd05; left: 95px; top: 95px; }

    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .controls button {
        padding: 12px 20px; font-size: 16px; font-weight: bold;
        background: white; border: 1px solid #ccc; border-radius: 20px;
        cursor: pointer;
    }
    .controls button:active { background: #eee; }
    .controls button.primary { background: #eef5ff; border-color: #b6d4fe; }
    
    #clue-panel {
        background: #eef5ff; border: 1px solid #b6d4fe; border-radius: 8px;
        padding: 15px; margin-bottom: 20px; text-align: left; font-size: 14px;
    }
    .pangram-clue { margin-bottom: 10px; font-weight: bold; color: #0056b3; }
    .clue-tag {
        display: inline-block; background: #fff; border: 1px solid #ccc;
        padding: 4px 8px; margin: 3px; border-radius: 4px; font-weight: bold;
    }

    #word-list {
        display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
        border-top: 1px solid #ccc; padding-top: 20px;
    }
    .found-word {
        background: #fff; border: 1px solid #ddd; padding: 6px 12px;
        border-radius: 15px; text-transform: capitalize; font-size: 15px;
    }
    .found-word.pangram { font-weight: bold; background: #fffde7; border-color: #f8cd05; }
    .found-word.incorrect { background: #ffebee; border-color: #ef9a9a; color: #c62828; }

    #message-box {
        position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px;
        border-radius: 8px; font-size: 16px; opacity: 0; pointer-events: none;
        transition: opacity 0.3s; z-index: 100;
    }

    #willie-miller-img {
        display: none; 
        position: fixed; 
        bottom: 20px; 
        right: 20px; 
        z-index: 1000; 
        width: 180px; 
        border-radius: 12px; 
        box-shadow: 0 0 20px rgba(0,0,0,0.5); 
        pointer-events: none;
        opacity: 0.8;
    }
    @media (max-width: 600px) {
        #willie-miller-img {
            bottom: unset;
            top: 15px;
            right: 15px;
            width: 90px;
        }
    }
</style>
</head>
<body>

<audio id="whistle-snd" src="youssefmizani-a-shrill-thin-horn-sound-510622.mp3" preload="auto"></audio>
<audio id="cheer-snd" src="u_xg7ssi08yr-crowd-cheering-379666.mp3" preload="auto"></audio>

<div class="header">
    <div class="stats">
        Score: <span id="current-score" class="score-highlight">0</span>
    </div>
    <div class="timer" id="timer">07:00</div>
</div>

<div id="start-screen">
    <h2>Pangram Game</h2>
    <p id="loading-status" style="font-weight:bold; color:#0056b3;">Connecting to dictionary...</p>
    
    <div class="setup-group">
        <label for="game-num-input">Game Number:</label>
        <input type="number" id="game-num-input" value="1" min="1">
    </div>

    <button id="start-btn" disabled onclick="confirmStartGame()">Connecting...</button>
</div>

<div id="game-screen" style="display: none;">
    <div id="message-box"></div>
    <div class="game-info" id="game-info"></div>
    <div id="input-display" class="input-display"></div>
    
    <div class="hive" id="hive">
        <div class="cell outer" onclick="typeLetter(this.innerText)"></div>
        <div class="cell outer" onclick="typeLetter(this.innerText)"></div>
        <div class="cell outer" onclick="typeLetter(this.innerText)"></div>
        <div class="cell outer" onclick="typeLetter(this.innerText)"></div>
        <div class="cell outer" onclick="typeLetter(this.innerText)"></div>
        <div class="cell outer" onclick="typeLetter(this.innerText)"></div>
        <div class="cell center" id="cell-center" onclick="typeLetter(this.innerText)"></div>
    </div>

    <div class="controls">
        <button onclick="handleBackspace()">Delete</button>
        <button onclick="handleClear()">Clear</button>
        <button onclick="jumble()">🔄 Jumble</button>
        <button onclick="submitWord()">Enter</button>
    </div>
    <div class="controls">
        <button class="primary" onclick="toggleClue()">Clues</button>
        <button class="primary" onclick="startNewGame()">New Game</button>
        <button class="primary" onclick="exitToMainMenu()">Menu</button>
    </div>

    <div id="clue-panel" style="display: none;">
        <div id="pangram-clue" class="pangram-clue"></div>
        <strong>Remaining Words by Prefix:</strong>
        <div id="clue-output"></div>
    </div>

    <div id="word-list"></div>
    
    <img id="willie-miller-img" src="ecwc.jpeg" alt="Willie Miller ECWC">
</div>

<script>
    let validWords = [];
    let pangramBases = [];
    let possibleWords = [];
    let foundWords = [];
    
    let letters = [];
    let outerLetters = [];
    let centerLetter = "";
    
    let currentScore = 0;
    let currentInput = "";
    
    let timerInterval;
    let timeLeft = 420;
    let gameActive = false;
    let msgTimeout;

    let dateString = new Date().toDateString();
    let gameIndex = 1;
    let rng;

    function xmur3(str) {
        for(var i = 0, h = 1779033703 ^ str.length; i < str.length; i++) {
            h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
            h = h << 13 | h >>> 19;
        } return function() {
            h = Math.imul(h ^ (h >>> 16), 2246822507);
            h = Math.imul(h ^ (h >>> 13), 3266489909);
            return (h ^= h >>> 16) >>> 0;
        }
    }
    
    function mulberry32(a) {
        return function() {
          var t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
    }

    async function init() {
        const btn = document.getElementById('start-btn');
        const statusText = document.getElementById('loading-status');
        
        try {
            statusText.innerText = "Downloading dictionary (~4MB)...";
            btn.innerText = "Downloading...";
            
            const response = await fetch('https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt?nocache=' + new Date().getTime());
            
            if (!response.ok) throw new Error("Network request blocked.");
            
            statusText.innerText = "Processing words...";
            const text = await response.text();
            
            const allWords = text.split(/\r?\n/).map(w => w.trim().toLowerCase()).filter(w => w.length > 0);
            const rawSet = new Set(allWords);
            
            const chunkSize = 20000;
            for (let i = 0; i < allWords.length; i += chunkSize) {
                const chunk = allWords.slice(i, i + chunkSize);
                
                for (const word of chunk) {
                    try {
                        if (word.length >= 4) {
                            // Plural rule: Remove if ending in 's', but protect double-s words like 'glass', 'boss'
                            if (word.endsWith('s') && !word.endsWith('ss') && rawSet.has(word.slice(0, -1))) continue; 
                            
                            // Past tense rule: Only checks words ending in 'ed' to protect words like 'prod', 'wind', 'fund'
                            // Length safeguard prevents short words like 'seed', 'weed', 'feed' from being axed
                            if (word.endsWith('ed') && word.length > 4) {
                                // Checks if base word exists without 'd' (baked -> bake) or without 'ed' (jumped -> jump)
                                if (rawSet.has(word.slice(0, -1)) || rawSet.has(word.slice(0, -2))) continue;
                            }

                            validWords.push(word);
                            const uniqueLetters = new Set(word);
                            if (uniqueLetters.size === 7) pangramBases.push(Array.from(uniqueLetters).join(''));
                        }
                    } catch (innerErr) {
                        continue;
                    }
                }
                
                let percent = Math.round((i / allWords.length) * 100);
                statusText.innerText = `Filtering dictionary rules... ${percent}%`;
                await new Promise(r => setTimeout(r, 1)); 
            }
            
            btn.innerText = "Start Game";
            btn.disabled = false;
            statusText.innerText = "Ready to play!";
            statusText.style.color = "#4CAF50";
            
        } catch (e) {
            btn.innerText = "Load Failed";
            statusText.innerText = "Connection blocked. Please refresh (Ctrl+Shift+R) or check internet connection.";
            statusText.style.color = "red";
            console.error(e);
        }
    }

    function playWhistle() {
        const snd = document.getElementById('whistle-snd');
        snd.currentTime = 0;
        snd.play().catch(e => console.log(e));
        setTimeout(() => { snd.pause(); }, 4000);
    }

    function playCheer() {
        const snd = document.getElementById('cheer-snd');
        snd.currentTime = 2;
        snd.play().catch(e => console.log(e));
        setTimeout(() => { snd.pause(); }, 3000);
    }

    function getWordScore(word) {
        if (word.length === 4) return 1;
        let score = word.length;
        if (isPangram(word)) score += 7;
        return score;
    }

    function isPangram(word) {
        return new Set(word.split('')).size === 7;
    }

    function confirmStartGame() {
        const inputVal = parseInt(document.getElementById('game-num-input').value);
        gameIndex = isNaN(inputVal) || inputVal < 1 ? 1 : inputVal;
        startGame();
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('game-info').innerText = `Game #${gameIndex} | ${dateString}`;
        
        const seed = xmur3(dateString + "-" + gameIndex)();
        rng = mulberry32(seed);

        let attempts = 0;
        while(attempts < 1000) {
            let base = pangramBases[Math.floor(rng() * pangramBases.length)];
            let center = base[Math.floor(rng() * base.length)];
            
            possibleWords = validWords.filter(w => {
                if (!w.includes(center)) return false;
                for (let char of w) if (!base.includes(char)) return false;
                return true;
            });
            
            if (possibleWords.length > 15) {
                letters = base.split('');
                centerLetter = center;
                outerLetters = letters.filter(l => l !== center);
                break;
            }
            attempts++;
        }
        
        gameActive = true;
        document.getElementById('hive').style.opacity = '1';
        updateBoard();
        startTimer();
        if (document.getElementById('clue-panel').style.display !== 'none') updateClues();
    }

    function startNewGame() {
        gameIndex++;
        document.getElementById('game-num-input').value = gameIndex;
        resetGameVariables();
        startGame();
    }

    function exitToMainMenu() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'block';
        resetGameVariables();
    }

    function resetGameVariables() {
        clearInterval(timerInterval);
        currentScore = 0;
        foundWords = [];
        currentInput = "";
        timeLeft = 420;
        document.getElementById('current-score').innerText = "0";
        document.getElementById('word-list').innerHTML = "";
        document.getElementById('input-display').innerHTML = "";
    }

    function positionCells() {
        const angles = [-90, -30, 30, 90, 150, 210];
        const r = 90;
        const outerCells = document.querySelectorAll('.cell.outer');
        outerCells.forEach((cell, i) => {
            const rad = angles[i] * Math.PI / 180;
            const x = 95 + r * Math.cos(rad);
            const y = 95 + r * Math.sin(rad);
            cell.style.left = `${x}px`; cell.style.top = `${y}px`;
        });
    }

    function updateBoard() {
        positionCells();
        document.getElementById('cell-center').innerText = centerLetter;
        const outerCells = document.querySelectorAll('.cell.outer');
        outerCells.forEach((cell, i) => cell.innerText = outerLetters[i]);
    }

    function jumble() {
        for (let i = outerLetters.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [outerLetters[i], outerLetters[j]] = [outerLetters[j], outerLetters[i]];
        }
        updateBoard();
    }

    function typeLetter(letter) {
        if (!gameActive) return;
        currentInput += letter.toLowerCase();
        updateInputDisplay();
        checkAutoSubmit(); 
    }

    function handleBackspace() {
        if (!gameActive) return;
        currentInput = currentInput.slice(0, -1);
        updateInputDisplay();
    }

    function handleClear() {
        if (!gameActive) return;
        currentInput = "";
        updateInputDisplay();
    }

    function updateInputDisplay() {
        const display = document.getElementById('input-display');
        display.innerHTML = '';
        for (let char of currentInput) {
            const span = document.createElement('span');
            span.innerText = char;
            if (char === centerLetter) span.className = 'center-char';
            display.appendChild(span);
        }
    }

    function showMessage(text) {
        const box = document.getElementById('message-box');
        box.innerText = text; box.style.opacity = '1';
        clearTimeout(msgTimeout);
        msgTimeout = setTimeout(() => box.style.opacity = '0', 1500);
    }

    function checkAutoSubmit() {
        if (possibleWords.includes(currentInput) && !foundWords.includes(currentInput)) {
            submitWord();
        }
    }

    function submitWord() {
        if (!gameActive || !currentInput) return;
        const word = currentInput;
        
        if (word.length < 4) { showMessage("Too short"); return; }
        if (!word.includes(centerLetter)) { showMessage("Missing center letter"); return; }
        if (foundWords.includes(word)) { showMessage("Already found"); currentInput = ""; updateInputDisplay(); return; }
        
        if (!possibleWords.includes(word)) { 
            showMessage("Not in word list");
            const div = document.createElement('div');
            div.innerText = `${word} (❌)`;
            div.className = 'found-word incorrect';
            document.getElementById('word-list').prepend(div);
            currentInput = "";
            updateInputDisplay();
            return; 
        }
        
        currentInput = "";
        updateInputDisplay();
        
        foundWords.push(word);
        const score = getWordScore(word);
        currentScore += score;
        document.getElementById('current-score').innerText = currentScore;
        
        const div = document.createElement('div');
        div.innerText = `${word} (${score})`;
        div.className = isPangram(word) ? 'found-word pangram' : 'found-word';
        document.getElementById('word-list').prepend(div);
        
        if (isPangram(word)) {
            showMessage("PANGRAM! +7");
            playCheer();
            
            const img = document.getElementById('willie-miller-img');
            img.style.display = 'block';
            setTimeout(() => { img.style.display = 'none'; }, 2000);
        } else {
            showMessage("Good!");
        }
        if (document.getElementById('clue-panel').style.display !== 'none') updateClues();
    }

    function toggleClue() {
        const panel = document.getElementById('clue-panel');
        if (panel.style.display === 'none') {
            updateClues();
            panel.style.display = 'block';
        } else {
            panel.style.display = 'none';
        }
    }

    function updateClues() {
        const remaining = possibleWords.filter(w => !foundWords.includes(w));
        const pangrams = possibleWords.filter(w => isPangram(w));
        const pangramLengths = pangrams.map(w => w.length).sort((a,b)=>a-b);
        
        document.getElementById('pangram-clue').innerText = 
            `Total Pangrams: ${pangrams.length} (${pangramLengths.map(l => l + ' letters').join(', ')})`;

        const clues = {};
        remaining.forEach(w => {
            const prefix = w.substring(0, 2).toUpperCase();
            clues[prefix] = (clues[prefix] || 0) + 1;
        });
        
        const sortedKeys = Object.keys(clues).sort();
        let html = "";
        if (sortedKeys.length === 0) {
            html = "All possible words found!";
        } else {
            for (let prefix of sortedKeys) {
                html += `<span class="clue-tag">${prefix}: ${clues[prefix]}</span>`;
            }
        }
        document.getElementById('clue-output').innerHTML = html;
    }

    function startTimer() {
        updateTimerDisplay();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function updateTimerDisplay() {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${m}:${s}`;
    }

    function endGame() {
        clearInterval(timerInterval);
        gameActive = false;
        playWhistle();
        showMessage("Time's Up!");
        document.getElementById('hive').style.opacity = '0.5';
    }

    document.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        const key = e.key.toLowerCase();
        if (key === 'enter') submitWord();
        else if (key === 'backspace') handleBackspace();
        else if (letters.includes(key)) typeLetter(key);
    });

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
